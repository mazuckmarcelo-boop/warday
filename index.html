<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAR DAY — Promocar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0b08;
    --bg2: #12140f;
    --red: #c81d25;
    --red-glow: #ff2a33;
    --olive: #4a5a35;
    --olive-dark: #2b3620;
    --gold: #e8b93a;
    --text: #e9e6d8;
    --text-dim: #9a9a8c;
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  html,body{
    width:100%; height:100%;
    background: radial-gradient(ellipse at 50% 0%, #1a1a12 0%, var(--bg) 60%), var(--bg);
    color: var(--text);
    font-family: 'Oswald', sans-serif;
    overflow:hidden; /* TV display: never scroll, everything must fit one screen */
  }

  /* subtle camo / grain overlay */
  body::before{
    content:"";
    position:fixed; inset:0;
    pointer-events:none;
    z-index: 50;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px);
    mix-blend-mode: overlay;
  }
  body::after{
    content:"";
    position:fixed; inset:0;
    pointer-events:none;
    z-index: 49;
    box-shadow: inset 0 0 180px 40px rgba(0,0,0,0.85);
  }

  .wrap{
    position:relative;
    z-index: 1;
    height:100vh;
    padding: clamp(8px,1.6vh,20px) clamp(16px,2.4vw,32px);
    display:flex;
    flex-direction:column;
    align-items:center;
    overflow:hidden;
  }

  header{
    width:100%;
    flex: 0 0 auto;
    text-align:center;
    margin-bottom: clamp(4px,1vh,14px);
    position:relative;
  }

  .kicker{
    letter-spacing: 6px;
    font-size: clamp(9px,1.3vh,13px);
    color: var(--olive);
    color: #7c8f5e;
    font-weight: 600;
    text-transform:uppercase;
  }

  h1{
    font-family: 'Black Ops One', sans-serif;
    font-size: clamp(28px, 6.5vh, 88px);
    letter-spacing: 4px;
    color: var(--text);
    text-shadow:
      3px 0 0 var(--red),
      -3px 0 0 rgba(80,140,90,0.55),
      0 0 40px rgba(200,29,37,0.35);
    line-height: 1;
    position:relative;
    animation: flicker 6s infinite;
  }
  h1 .glitch{ position:relative; display:inline-block; }

  @keyframes flicker{
    0%, 92%, 100% { opacity:1; }
    93% { opacity:0.85; text-shadow: -3px 0 0 var(--red), 3px 0 0 rgba(80,140,90,0.55); }
    94% { opacity:1; }
    95% { opacity:0.9; transform: translateX(1px); }
    96% { opacity:1; transform: none; }
  }

  .period{
    margin-top: clamp(2px,0.6vh,6px);
    font-size: clamp(11px, 1.8vh, 20px);
    letter-spacing: 3px;
    color: var(--text-dim);
    text-transform: uppercase;
    font-weight: 500;
  }
  .period b{ color: var(--gold); font-weight:600; }

  .countdown-row{
    margin-top: clamp(6px,1.2vh,16px);
    display:flex;
    gap: clamp(8px,1vw,14px);
    justify-content:center;
    flex-wrap: nowrap;
  }
  .cbox{
    background: linear-gradient(180deg, var(--olive-dark), #1c2314);
    border: 1px solid rgba(120,140,90,0.4);
    border-radius: 4px;
    padding: clamp(4px,0.9vh,8px) clamp(10px,1.4vw,16px);
    min-width: clamp(48px,5vw,72px);
    text-align:center;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.4), 0 6px 14px rgba(0,0,0,0.5);
  }
  .cbox .num{
    font-family:'Black Ops One', sans-serif;
    font-size: clamp(15px,2.6vh,28px);
    color: var(--gold);
    line-height:1;
  }
  .cbox .lbl{
    font-size: clamp(7px,1vh,10px);
    letter-spacing: 2px;
    color: var(--text-dim);
    text-transform:uppercase;
    margin-top:4px;
  }
  .countdown-ended{
    font-family:'Black Ops One', sans-serif;
    font-size: clamp(16px,3vh,22px);
    color: var(--red-glow);
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .status-banner{
    position: fixed;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    color: var(--gold);
    background: rgba(20,16,8,0.95);
    border: 1px solid rgba(200,29,37,0.4);
    padding: 8px 16px;
    border-radius: 4px;
    display:none;
    max-width: 90vw;
    text-align:center;
    z-index: 60;
  }
  .status-banner.show{ display:block; }

  .cards{
    width:100%;
    max-width: 1500px;
    flex: 1 1 auto;
    min-height: 0;
    display:grid;
    grid-template-columns: repeat(5, 1fr);
    gap: clamp(10px,1.3vw,20px);
    margin-top: clamp(8px,1.6vh,26px);
  }

  .card{
    position:relative;
    display:flex;
    flex-direction:column;
    height:100%;
    min-height:0;
    background: linear-gradient(160deg, #171911 0%, #0d0f0a 100%);
    border: 1px solid rgba(120,140,90,0.25);
    border-radius: 8px;
    overflow:hidden;
    padding-bottom: clamp(8px,1.4vh,18px);
    transition: transform .3s ease, box-shadow .3s ease;
  }
  .card.leader{
    border-color: var(--gold);
    box-shadow: 0 0 0 1px var(--gold), 0 0 30px rgba(232,185,58,0.35);
  }
  .card .stripe{
    height: 5px;
    width:100%;
    background: linear-gradient(90deg, var(--red), var(--olive));
  }
  .card.leader .stripe{
    background: linear-gradient(90deg, var(--gold), #fff3c4, var(--gold));
  }

  .rank-tag{
    position:absolute;
    top: 14px; left: 12px;
    font-family:'Black Ops One', sans-serif;
    font-size: 13px;
    background: rgba(0,0,0,0.55);
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--text-dim);
    padding: 3px 9px;
    border-radius: 3px;
    letter-spacing: 1px;
    z-index:2;
  }
  .card.leader .rank-tag{
    background: rgba(232,185,58,0.15);
    border-color: var(--gold);
    color: var(--gold);
  }

  .crown{
    position:absolute;
    top: 10px; right: 12px;
    font-size: 22px;
    z-index:2;
    filter: drop-shadow(0 0 6px rgba(232,185,58,0.8));
    display:none;
  }
  .card.leader .crown{ display:block; }

  .photo-wrap{
    width:100%;
    flex: 1 1 auto;
    min-height: 0;
    position:relative;
    overflow:hidden;
    background: #1a1c14;
  }
  .photo-wrap img{
    width:100%; height:100%;
    object-fit: cover;
    display:block;
    filter: grayscale(1) contrast(1.15) brightness(0.85);
  }
  .photo-wrap .duotone{
    position:absolute; inset:0;
    background: linear-gradient(160deg, rgba(200,29,37,0.35), rgba(58,74,47,0.5));
    mix-blend-mode: color;
    pointer-events:none;
  }
  .photo-wrap .vgrad{
    position:absolute; inset:0;
    background: linear-gradient(180deg, transparent 55%, rgba(10,11,8,0.95) 100%);
  }

  .avatar-fallback{
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Black Ops One', sans-serif;
    font-size: 54px;
    color: rgba(233,230,216,0.25);
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,0.03) 0 10px, transparent 10px 20px),
      #171911;
  }

  .name{
    flex: 0 0 auto;
    text-align:center;
    font-family:'Black Ops One', sans-serif;
    font-size: clamp(12px,2vh,20px);
    letter-spacing: 1px;
    margin-top: clamp(5px,1vh,12px);
    color: var(--text);
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding: 0 4px;
  }

  .stats{
    flex: 0 0 auto;
    display:flex;
    justify-content: space-around;
    margin-top: clamp(4px,1vh,14px);
    padding: 0 10px;
  }
  .stat{
    text-align:center;
  }
  .stat .val{
    font-family:'Black Ops One', sans-serif;
    font-size: clamp(16px,3.2vh,34px);
    line-height:1;
    color: var(--text);
  }
  .stat.fechadas .val{ color: var(--gold); }
  .stat .lbl{
    font-size: clamp(7px,1vh,10px);
    letter-spacing: 1.5px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-top: clamp(2px,0.6vh,6px);
  }
  .stat-divider{
    width:1px;
    background: rgba(255,255,255,0.1);
  }

  footer{
    flex: 0 0 auto;
    margin-top: clamp(6px,1.4vh,20px);
    text-align:center;
    color: var(--text-dim);
    font-size: clamp(9px,1.1vh,12px);
    letter-spacing: 1px;
  }
  footer .dot{
    display:inline-block;
    width:7px; height:7px;
    border-radius:50%;
    background: #5fbf5f;
    margin-right:6px;
    box-shadow: 0 0 6px #5fbf5f;
    animation: pulse 2s infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity:1; }
    50%{ opacity:0.3; }
  }

  /* Below this width we're almost certainly not on the TV (phone/small window) —
     allow the page to scroll and stack instead of squeezing 5 columns tight. */
  @media (max-width: 700px){
    html,body{ overflow:auto; height:auto; min-height:100%; }
    .wrap{ height:auto; min-height:100vh; padding: 18px 14px 30px; overflow:visible; }
    .cards{ grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap:14px; }
    .card{ height:auto; }
    .photo-wrap{ flex:none; aspect-ratio: 1 / 1; }
  }
</style>
</head>

  };

  const AVATAR_COLORS = {
    "Emerson": "#c81d25",
    "Ezequiel": "#4a5a35",
    "Fernando": "#8a6d1f",
    "Lucas": "#3a5a6d",
    "Gabriel": "#6d3a5a"
  };

  const cardsEl = document.getElementById('cards');
  const lastUpdateEl = document.getElementById('lastUpdate');
  const statusEl = document.getElementById('statusBanner');
  const countdownEl = document.getElementById('countdownRow');

  function initials(name){
    return name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
  }

  function render(data){
    // data: [{nome, negociando, fechadas}]
    const sorted = [...data].sort((a,b) => {
      if (b.fechadas !== a.fechadas) return b.fechadas - a.fechadas;
      if (b.negociando !== a.negociando) return b.negociando - a.negociando;
      return a.nome.localeCompare(b.nome);
    });

    cardsEl.innerHTML = sorted.map((v, i) => {
      const isLeader = i === 0 && v.fechadas > 0;
      const photo = PHOTOS[v.nome];
      const color = AVATAR_COLORS[v.nome] || '#4a5a35';
      const photoHtml = photo
        ? `<img src="${photo}" alt="${v.nome}"><div class="duotone"></div><div class="vgrad"></div>`
        : `<div class="avatar-fallback" style="color:${color}">${initials(v.nome)}</div><div class="vgrad"></div>`;

      return `
        <div class="card ${isLeader ? 'leader' : ''}">
          <div class="stripe"></div>
          <div class="rank-tag">#${i+1}</div>
          <div class="crown">👑</div>
          <div class="photo-wrap">${photoHtml}</div>
          <div class="name">${v.nome}</div>
          <div class="stats">
            <div class="stat negociando">
              <div class="val">${v.negociando}</div>
              <div class="lbl">Negociando</div>
            </div>
            <div class="stat-divider"></div>
            <div class="stat fechadas">
              <div class="val">${v.fechadas}</div>
              <div class="lbl">Fechadas</div>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  function parseGviz(text){
    const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);?\s*$/);
    if (!match) throw new Error('Formato inesperado da planilha');
    const json = JSON.parse(match[1]);
    const rows = json.table.rows || [];
    return rows
      .map(r => ({
        nome: r.c[0] && r.c[0].v ? String(r.c[0].v).trim() : null,
        negociando: r.c[1] && r.c[1].v != null ? Number(r.c[1].v) : 0,
        fechadas: r.c[2] && r.c[2].v != null ? Number(r.c[2].v) : 0
      }))
      .filter(v => v.nome);
  }

  async function fetchData(){
    try{
      const res = await fetch(GVIZ_URL, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      const data = parseGviz(text);
      if (!data.length) throw new Error('Sem linhas na planilha');
      render(data);
      statusEl.classList.remove('show');
      lastUpdateEl.textContent = new Date().toLocaleTimeString('pt-BR');
    }catch(err){
      statusEl.textContent = 'Não consegui carregar os dados da planilha agora. Confira se o compartilhamento está como "Qualquer pessoa com o link → Leitor". Tentando de novo...';
      statusEl.classList.add('show');
      console.error(err);
    }
  }

  function pad(n){ return String(n).padStart(2,'0'); }

  function tickCountdown(){
    const now = new Date();
    const diff = END_DATE - now;
    if (diff <= 0){
      countdownEl.innerHTML = `<div class="countdown-ended">🏁 War Day encerrado</div>`;
      return;
    }
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    countdownEl.innerHTML = `
      <div class="cbox"><div class="num">${d}</div><div class="lbl">dias</div></div>
      <div class="cbox"><div class="num">${pad(h)}</div><div class="lbl">horas</div></div>
      <div class="cbox"><div class="num">${pad(m)}</div><div class="lbl">min</div></div>
      <div class="cbox"><div class="num">${pad(s)}</div><div class="lbl">seg</div></div>
    `;
  }

  // initial render with zeros so the screen isn't empty while first fetch runs
  render(Object.keys(PHOTOS).map(nome => ({ nome, negociando: 0, fechadas: 0 })));

  fetchData();
  setInterval(fetchData, REFRESH_MS);
  tickCountdown();
  setInterval(tickCountdown, 1000);
</script>
</body>
</html>
